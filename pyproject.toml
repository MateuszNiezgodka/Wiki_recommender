[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wiki-recommender"
version = "0.1.0"
description = "Content-based recommender system for Wikipedia / Fandom wiki articles (Information Retrieval project)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "en-core-web-sm",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "nltk>=3.10.4",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "spacy>=3.8.18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_recommender"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
